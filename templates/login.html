{% extends "base.html" %}
{% block title %}登录 - 校园微心愿{% endblock %}
{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-stars text-primary" style="font-size:3rem"></i>
                    <h4 class="mt-2">校园微心愿</h4>
                    <p class="text-muted small">让每一份小心愿都被看见</p>
                </div>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">学号</label>
                        <input type="text" name="student_id" class="form-control" placeholder="请输入学号" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">姓名</label>
                        <input type="text" name="name" class="form-control" placeholder="请输入姓名" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">进入平台</button>
                </form>
                <p class="text-muted small text-center mt-3 mb-0">首次登录自动注册，初始信用分100</p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
